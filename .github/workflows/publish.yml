name: publish

on:
  push:
    branches: [main]
    paths: ["plugins/**", "tools/**", ".github/workflows/publish.yml"]   # new plugins, or a new hi
  workflow_dispatch:          # "Run workflow" in the Actions tab — e.g. once the signing key is added

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Get hi (pinned by its SHA-256)
        id: hi
        run: echo "path=$(tools/get-hi.sh)" >> "$GITHUB_OUTPUT"

      - name: Pack and sign the new versions
        env:
          HI_SIGNING_KEY: ${{ secrets.HI_SIGNING_KEY }}
        run: python3 tools/publish.py "${{ steps.hi.outputs.path }}" dist "https://github.com/${{ github.repository }}/releases/download/plugins"

      - name: Attach them to the plugins release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/*.zip >/dev/null 2>&1 || { echo "nothing new"; exit 0; }
          gh release view plugins >/dev/null 2>&1 || gh release create plugins --title "Plugins" --notes "Packed plugins. index.json lists them."
          gh release upload plugins dist/*.zip --clobber

      - name: Commit the index
        run: |
          git config user.name "hi"
          git config user.email "hi@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || { git commit -m "index: new versions"; git push; }
