name: check

on:
  pull_request:
    paths: ["plugins/**"]

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get hi (pinned by its SHA-256)
        id: hi
        run: echo "path=$(tools/get-hi.sh)" >> "$GITHUB_OUTPUT"

      - name: Check the changed plugins
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_changed.py "$BASE" "${{ steps.hi.outputs.path }}"
